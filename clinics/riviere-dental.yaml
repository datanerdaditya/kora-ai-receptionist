policies:
- Please cancel or reschedule at least 24 hours before your appointment.
- Missed appointments without notice may be charged 30 euros.
- If you are more than 10 minutes late, we may need to reschedule.
- Payment is by bank card or cash. Cheques are not accepted.
- The clinic accepts the carte Vitale. Reimbursement depends on your own cover.
- New patients are welcome. Please arrive 10 minutes early for a first visit.
faqs:
- q: Is there parking?
  a: There is no clinic car park. The nearest public car park is Parking Oberkampf, about three minutes
    away on foot.
- q: Is the clinic wheelchair accessible?
  a: Yes. The entrance is step-free and there is an accessible toilet.
- q: What should I bring to my first appointment?
  a: An identity document, your carte Vitale if you have one, and a list of any medicines you take.
- q: Do you treat children?
  a: Yes. Dr Lefèvre sees children from the age of three.
- q: Do the dentists speak English?
  a: Yes. All staff speak French and English.
- q: How should I prepare for teeth whitening?
  a: Have a check-up first, and a cleaning is recommended in the two weeks before. Avoid coffee, tea and
    red wine for 48 hours afterwards.
- q: Can I pay in instalments?
  a: Payment in two or three instalments is possible for treatments over 300 euros. Please ask at reception.
emergency:
  life_threatening: For heavy bleeding that will not stop, difficulty breathing or swallowing, swelling
    of the face that is spreading, or a serious injury to the face or jaw, call 15 or 112 immediately.
  out_of_hours: When the clinic is closed and you have severe dental pain, call 15 and ask for the on-call
    dentist.
staff_contact:
